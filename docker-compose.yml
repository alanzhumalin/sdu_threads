services:
  redis:
    image: redis:7-alpine
    container_name: sdu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - app

  db:
    image: postgres:16-alpine
    container_name: sdu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdu_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sdu_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdu_user} -d ${POSTGRES_DB:-sdu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  db_restore:
    image: postgres:16-alpine
    container_name: sdu-db-restore
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-sdu_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-sdu_pass}
      PGDATABASE: ${POSTGRES_DB:-sdu_db}
    volumes:
      - ./:/host:ro
    command: >
      sh -ec '
        echo "[db_restore] waiting for postgres...";
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" -d "$$PGDATABASE"; do sleep 1; done;

        DUMP="/host/db.dump";
        if [ ! -s "$$DUMP" ]; then
          echo "[db_restore] no /host/db.dump found, skipping restore";
          exit 0;
        fi;

        TABLES="$$(psql -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='\''public'\'';" | tr -d "[:space:]")";
        if [ "$$TABLES" != "0" ]; then
          echo "[db_restore] DB is not empty (public tables: $$TABLES), skipping restore";
          exit 0;
        fi;

        echo "[db_restore] restoring from $$DUMP";
        pg_restore --clean --if-exists --no-owner --no-privileges --exit-on-error -d "$$PGDATABASE" "$$DUMP";
        echo "[db_restore] restore done";
      '
    networks:
      - app

  db_backup:
    image: postgres:16-alpine
    container_name: sdu-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db_restore:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-sdu_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-sdu_pass}
      PGDATABASE: ${POSTGRES_DB:-sdu_db}
    volumes:
      - ./:/host:rw
    command: >
      sh -ec '
        umask 022;
        echo "[db_backup] waiting for postgres...";
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" -d "$$PGDATABASE"; do sleep 1; done;

        while true; do
          echo "[db_backup] sleeping 3600s...";
          sleep 3600;

          echo "[db_backup] creating /host/db.dump";
          pg_dump -Fc -d "$$PGDATABASE" -f /host/db.dump.tmp;
          mv /host/db.dump.tmp /host/db.dump;
          chmod 0644 /host/db.dump || true;
          echo "[db_backup] dump updated";
        done
      '
    networks:
      - app

  moderation:
    build:
      context: ./moderation
      dockerfile: Dockerfile
    container_name: sdu-moderation
    restart: unless-stopped
    environment:
      MODERATION_LOG_LEVEL: ${MODERATION_LOG_LEVEL:-INFO}
      MODERATION_TEXT_MODEL: ${MODERATION_TEXT_MODEL:-s-nlp/russian_toxicity_classifier}
      MODERATION_IMAGE_MODEL: ${MODERATION_IMAGE_MODEL:-Falconsai/nsfw_image_detection}
      MODERATION_SUGGESTIVE_MODEL: ${MODERATION_SUGGESTIVE_MODEL:-prithivMLmods/Mature-Content-Detection}
      MODERATION_TEXT_THRESHOLD: ${MODERATION_TEXT_THRESHOLD:-0.75}
      MODERATION_IMAGE_THRESHOLD: ${MODERATION_IMAGE_THRESHOLD:-0.70}
      MODERATION_SUGGESTIVE_THRESHOLD: ${MODERATION_SUGGESTIVE_THRESHOLD:-0.45}
      MODERATION_BLOCK_SUGGESTIVE: ${MODERATION_BLOCK_SUGGESTIVE:-true}
      MODERATION_TEXT_MODEL_REQUIRED: ${MODERATION_TEXT_MODEL_REQUIRED:-false}
      MODERATION_IMAGE_MODEL_REQUIRED: ${MODERATION_IMAGE_MODEL_REQUIRED:-true}
      MODERATION_SUGGESTIVE_MODEL_REQUIRED: ${MODERATION_SUGGESTIVE_MODEL_REQUIRED:-false}
      MODERATION_MAX_TEXT_CHARS: ${MODERATION_MAX_TEXT_CHARS:-5000}
      MODERATION_MAX_IMAGE_BYTES: ${MODERATION_MAX_IMAGE_BYTES:-7340032}
      MODERATION_FETCH_TIMEOUT_SEC: ${MODERATION_FETCH_TIMEOUT_SEC:-5}
      MODERATION_INFER_MAX_SIDE: ${MODERATION_INFER_MAX_SIDE:-1024}
      MODERATION_PRELOAD_MODELS: ${MODERATION_PRELOAD_MODELS:-true}
      MODERATION_SUGGESTIVE_BG_WARMUP: ${MODERATION_SUGGESTIVE_BG_WARMUP:-true}
      MODERATION_BLOCKED_TERMS: ${MODERATION_BLOCKED_TERMS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/livez', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    volumes:
      - moderation_hf_cache:/root/.cache/huggingface
      - moderation_torch_cache:/root/.cache/torch
    networks:
      - app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdu-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db_restore:
        condition: service_completed_successfully
      moderation:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-sdu_user}:${POSTGRES_PASSWORD:-sdu_pass}@db:5432/${POSTGRES_DB:-sdu_db}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-120}
      VIEW_TTL_MIN: ${VIEW_TTL_MIN:-15}
      
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}

      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_SIGNATURE_VERSION: ${S3_SIGNATURE_VERSION:-v4}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_PREFIX: ${S3_PREFIX:-}
      MODERATION_ENABLED: ${MODERATION_ENABLED:-true}
      MODERATION_URL: ${MODERATION_URL:-http://moderation:8001}
      MODERATION_TIMEOUT_MS: ${MODERATION_TIMEOUT_MS:-4000}
      MODERATION_FAIL_CLOSED: ${MODERATION_FAIL_CLOSED:-true}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_REDIS_ADDR: ${CACHE_REDIS_ADDR:-redis:6379}
      CACHE_REDIS_PASSWORD: ${CACHE_REDIS_PASSWORD:-}
      CACHE_REDIS_DB: ${CACHE_REDIS_DB:-0}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-sdu:cache:}
      CACHE_L1_MAX_ENTRIES: ${CACHE_L1_MAX_ENTRIES:-5000}
      CACHE_L1_CLEANUP_SEC: ${CACHE_L1_CLEANUP_SEC:-60}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - app

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: sdu-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
      - ./nginx/certs:/etc/nginx/certs:rw
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  nginx_cache:
  nginx_logs:
  moderation_hf_cache:
  moderation_torch_cache:

networks:
  app:
