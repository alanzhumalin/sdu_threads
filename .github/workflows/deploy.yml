name: Deploy To Server

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 80m
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then
              echo "DEPLOY_PATH is empty"
              exit 1
            fi

            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "DEPLOY_PATH does not exist: $DEPLOY_DIR"
              exit 1
            fi

            cd "$DEPLOY_DIR"

            if [ ! -d .git ]; then
              echo "DEPLOY_PATH is not a git repository: $DEPLOY_DIR"
              echo "Set DEPLOY_PATH to repo root, for example: /root/sdu_threads"
              exit 1
            fi

            git fetch origin dev
            git checkout dev
            git pull --ff-only origin dev

            docker compose up -d --build
            docker compose ps
