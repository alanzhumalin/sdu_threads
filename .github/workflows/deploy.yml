name: Deploy To Server

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 80m
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then
              echo "DEPLOY_PATH is empty"
              exit 1
            fi

            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "DEPLOY_PATH does not exist: $DEPLOY_DIR"
              exit 1
            fi

            cd "$DEPLOY_DIR"

            if [ ! -d .git ]; then
              echo "DEPLOY_PATH is not a git repository: $DEPLOY_DIR"
              echo "Set DEPLOY_PATH to repo root, for example: /root/sdu_threads"
              exit 1
            fi

            git fetch origin dev
            git checkout dev
            git pull --ff-only origin dev

            # Free old build cache/layers to avoid "no space left on device" during image export.
            docker system df || true
            docker builder prune -af || true
            docker image prune -af || true

            retry() {
              local max_attempts="$1"
              local sleep_seconds="$2"
              shift 2
              local attempt=1
              while true; do
                if "$@"; then
                  return 0
                fi
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Command failed after ${attempt} attempts: $*"
                  return 1
                fi
                echo "Attempt ${attempt}/${max_attempts} failed. Retrying in ${sleep_seconds}s: $*"
                attempt=$((attempt + 1))
                sleep "$sleep_seconds"
              done
            }

            # Docker Hub can intermittently fail with TLS handshake timeout.
            # Pre-pull base images with retries to reduce flaky build failures.
            retry 5 10 docker pull python:3.11-slim
            retry 5 10 docker pull node:20-alpine
            retry 5 10 docker pull nginx:1.25-alpine
            retry 5 10 docker pull golang:1.25-alpine
            retry 5 10 docker pull alpine:3.19

            retry 4 12 docker compose build --pull moderation backend nginx
            docker compose up -d moderation backend nginx
            docker compose ps
