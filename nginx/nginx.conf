worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml;

    upstream backend {
        server backend:8080;
    }

    # When running behind Cloudflare you may want to pass the real client IP to the backend.
    # We keep it minimal here; harden with firewall rules (allow only Cloudflare to origin).
    map $http_cf_connecting_ip $client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log warn;

        client_max_body_size 20m;

        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $client_ip;
            proxy_set_header   X-Forwarded-For $client_ip;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        http2 on;

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log warn;

        client_max_body_size 20m;

        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $client_ip;
            proxy_set_header   X-Forwarded-For $client_ip;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
        }
    }
}
